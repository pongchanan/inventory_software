[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --ignore=test/manual
markers =
    unit: single component tests without external dependencies
    integration: cross-component tests within backend
    contract: API contract and schema validation tests
    slow: long-running tests
    manual: tests requiring external services or hardware, run explicitly only
