[pytest]
# ============================================================================
# PYTEST CONFIGURATION - Automated & Manual Test Separation
# ============================================================================

# File discovery and naming conventions
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options: Run all automated tests (excludes manual by default)
# This ensures fast TDD feedback loop
addopts = 
    -v
    --tb=short
    --strict-markers
    --ignore=test/manual

# ============================================================================
# TEST MARKERS - Categorize tests by type and scope
# ============================================================================
# 
# @pytest.mark.unit:
#   - Single component testing
#   - No network calls or external services
#   - Fastest tests, most deterministic
#   - Ideal for TDD Red-Green-Refactor loop
#
# @pytest.mark.integration:
#   - Cross-component behavior testing
#   - May use test database or test fixtures
#   - Slower than unit tests but still fast
#   - Tests component interactions within backend
#
# @pytest.mark.contract:
#   - API request/response validation
#   - Schema and data structure guarantees
#   - Tests external API contracts
#
# @pytest.mark.slow:
#   - Tests known to take significant time
#   - Deselect with: pytest -m "not slow"
#
# @pytest.mark.manual:
#   - Requires external services (backend, frontend, etc.)
#   - Non-deterministic, depends on external state
#   - Requires explicit invocation: pytest test/manual
#   - For QA and integration verification
#
markers =
    unit: Single component, no external deps (fastest)
    integration: Cross-component behavior testing within backend
    contract: API request/response validation and schema guarantees
    slow: Marks tests as slow (deselect with '-m "not slow"')
    manual: Requires external services/hardware - run explicitly only

# ============================================================================
# COMMON TEST COMMANDS
# ============================================================================
#
# Fast automated tests (recommended for TDD):
#   pytest                           # All automated tests
#   pytest -x                        # Stop on first failure
#   pytest -m "unit or contract"     # Fast deterministic tests only
#
# Specific test types:
#   pytest -m unit                   # Unit tests only
#   pytest -m contract               # Contract tests only
#   pytest -m integration            # Integration tests only
#
# With coverage:
#   pytest --cov=app                 # Coverage of app package
#   pytest --cov=app --cov-report=html  # Generate HTML report
#
# Manual tests (requires backend running at http://localhost:3000):
#   pytest test/manual               # All manual tests
#   pytest test/manual/test_cors.py  # Specific manual test
#
# All helper scripts:
#   python test_runner.py help       # Show all commands
#   ./test.sh auto                   # Linux/Mac
#   test.bat auto                    # Windows
#
