$kind: http-example
request:
  url: "{{baseUrl}}/api/items/:item_id/image"
  method: PUT
  headers:
    Content-Type: multipart/form-data
    Accept: application/json
  pathVariables:
    item_id: "898"
  body:
    type: formdata
    content:
      - type: file
        key: image
        src: ""
        description: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 9123,
        "name": "string",
        "quantity": 9655,
        "is_active": true,
        "image": null,
        "enroll_status": "string",
        "sample_count": 0
      }
order: 1000
